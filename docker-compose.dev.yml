services:
  voluntee-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: voluntee-dev
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
      - PORT=8080
      - HOST=0.0.0.0
    volumes:
      - ./public:/app/public
    restart: unless-stopped
